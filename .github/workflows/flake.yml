name: flake

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast gate: flake eval + stdlib-only frontend tests + CPU reference tests.
  # No GPU, no CUDA build. Runs on every push / PR.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: nix flake check
        run: nix flake check --no-update-lock-file

  # Path filter: only run the expensive CUDA build when engine sources change.
  paths:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            engine:
              - 'engine/**'
              - 'flake.nix'
              - 'pkgs/**'

  # Engine build: compiles libq27.so for sm_120a (no GPU needed, nvcc cross-compiles).
  # First run compiles ~20 .cu files (~10–20 min); subsequent runs are cached.
  engine:
    needs: [check, paths]
    if: needs.paths.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: nix build engine
        run: nix build --no-update-lock-file .#engine
